[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "voice-detect-ui"
version = "0.1.0"
description = "Multi-modal voice analysis UI with age/gender, emotion, and speaker verification"
authors = [
    {name = "Admin", email = "admin@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
keywords = ["voice", "audio", "ml", "gradio", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "gradio>=4.0.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "matplotlib>=3.5.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.20.0",
    "sentencepiece>=0.1.99",
    "onnxruntime>=1.15.0",
    "huggingface-hub>=0.19.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/freyandere/voice-detect-ui"
Repository = "https://github.com/freyandere/voice-detect-ui.git"
Documentation = "https://github.com/freyandere/voice-detect-ui/blob/main/README.md"

[tool.setuptools]
packages = ["voice_detect_ui"]
package-dir = {"voice_detect_ui" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
ignore = ["E203", "W503"]
per-file-ignores = ["__init__.py: F401"]
